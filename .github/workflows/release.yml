---
# =============================================================================
# GitHub Actions Workflow: Release Automation & Galaxy Publishing
# =============================================================================
name: Release

run-name: "Release [${{ github.ref_name }}]"

"on":
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Release Please Automation
  # ---------------------------------------------------------------------------
  release-please:
    name: "🤖 Release Please"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - name: "📦 Run Release Please Action"
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ---------------------------------------------------------------------------
  # Job 2: Validate Release PR Integrity
  # ---------------------------------------------------------------------------
  validate-release-pr:
    name: "🔍 Validate Release PR"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: release-please
    if: ${{ needs.release-please.outputs.prs_created == 'true' }}
    permissions:
      contents: read
      statuses: write
      pull-requests: read
    steps:
      - name: "🔍 Resolve Release PR details"
        id: resolve_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh pr list --repo "${{ github.repository }}" --head "release-please--branches--main" --json number,headRefOid --limit 1)
          PR_HEAD_SHA=$(echo "$PR_JSON" | python3 -c "import sys, json; data=json.load(sys.stdin); print(data[0]['headRefOid'] if data else '')")

          if [[ -z "$PR_HEAD_SHA" ]]; then
            echo "No active release-please PR branch head SHA found."
            exit 1
          fi

          echo "pr_head_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: "📥 Checkout Release PR branch"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: release-please--branches--main
          persist-credentials: false

      - name: "🧹 Run YAML Linting"
        run: pipx run yamllint .

      - name: "⚙️ Run Actionlint Validation"
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7  # v2.2.0

      - name: "🌌 Validate Galaxy Metadata Spec"
        run: |
          python3 -c "
          import yaml, sys
          with open('meta/main.yml', 'r') as f:
              data = yaml.safe_load(f)
          assert 'galaxy_info' in data, 'meta/main.yml missing galaxy_info section'
          info = data['galaxy_info']
          for key in ['author', 'description', 'license', 'min_ansible_version', 'platforms']:
              assert key in info, f'meta/main.yml missing field: {key}'
          print('Galaxy metadata specification valid.')
          "

      - name: "🚦 Publish Commit Status Check"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.resolve_pr.outputs.pr_head_sha }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/${SHA}" \
            -f state='success' \
            -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description='Release PR validation gate passed' \
            -f context='Merge Check Gate'

  # ---------------------------------------------------------------------------
  # Job 3: Publish Role to Ansible Galaxy
  # ---------------------------------------------------------------------------
  publish-to-galaxy:
    name: "🚀 Publish to Ansible Galaxy"
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: grzegorzfranus/github-workflows/.github/workflows/ansible-publish.yml@main
    secrets:
      galaxy-api-key: ${{ secrets.GALAXY_API_KEY }}
